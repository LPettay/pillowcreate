services:
  pillowcreate:
    image: itzg/minecraft-server:java21
    container_name: pillowcreate
    ports:
      - "25565:25565"      # Minecraft (forward on router for friends)
      - "30078:30078"      # AutoModpack HTTP (forward so friends auto-download the pack)
    environment:
      EULA: "TRUE"

      TYPE: NEOFORGE
      VERSION: "1.21.1"

      MEMORY: "6G"

      MODE: creative
      FORCE_GAMEMODE: "TRUE"
      DIFFICULTY: peaceful
      LEVEL_TYPE: minecraft:normal
      ALLOW_FLIGHT: "TRUE"
      MOTD: "PillowCreate - Aeronautics"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      SPAWN_PROTECTION: "0"

      MODRINTH_PROJECTS: |
        create
        sable
        create-aeronautics
        automodpack
        kubejs

      OPS: "${OPS:-}"
      WHITELIST: "${WHITELIST:-}"
      ENFORCE_WHITELIST: "${ENFORCE_WHITELIST:-FALSE}"

    volumes:
      - ./data:/data
      - ./kubejs:/data/kubejs
      - ./datapacks:/datapacks-staging:ro

    restart: unless-stopped
    stdin_open: true
    tty: true
